services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: replog
      POSTGRES_PASSWORD: replog
      POSTGRES_DB: replog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
